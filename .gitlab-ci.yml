image: node:22

stages:
  - deploy

pages:
  stage: deploy
  script:
    - apt-get update && apt-get install -y --no-install-recommends ruby jq
    - npm ci
    - npm run verify
    - git diff --exit-code -- assets/search-index.js src/lib/generated-docs
    - npm run build
    - npx playwright install --with-deps chromium
    - PREVIEW=1 npm run test:e2e
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
